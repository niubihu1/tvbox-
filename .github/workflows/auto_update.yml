name: TVBox 接口自动巡检与全网源汇聚

on:
  schedule:
    # 每天北京时间凌晨 04:00 (UTC 20:00) 自动触发
    - cron: '0 20 * * *'
  workflow_dispatch: # 支持在 GitHub 页面手动一键触发

permissions:
  contents: write

jobs:
  auto-check-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp requests

      - name: 运行全网采集、测活与智能重组
        run: |
          python -m auto_engine.main --all

      - name: 提交并推送到 GitHub 仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add 1.json 自用仓库.txt auto_engine/data/
          if git diff --staged --quiet; then
            echo "没有任何变更需要提交"
          else
            git commit -m "chore(auto): 每日全网源自动巡检与精选重组更新 [skip ci]"
            git push origin main
          fi
